<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全面质量管理 · 题库练习</title>
<style>
  :root{
    --bg: #14181d;
    --panel: #1c222a;
    --panel-2: #232a33;
    --line: #313a45;
    --text: #e9edf1;
    --muted: #8b96a3;
    --accent: #2dd4bf;
    --accent-dim: #1a5c54;
    --warn: #f5a623;
    --bad: #ef5b5b;
    --good: #34c77b;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height:1.5;
    padding: 14px 12px 40px;
    max-width: 520px;
    margin: 0 auto;
  }
  h1{font-size:0;margin:0;}

  /* header */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .brand{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .brand small{
    display:block;
    font-weight:400;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.5px;
    margin-top:2px;
  }
  .stat-pill{
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 10px;
    white-space:nowrap;
  }
  .stat-pill b{color:var(--accent);font-weight:700;}

  /* control chart style progress */
  .gauge{
    position:relative;
    height:34px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
    margin-bottom:12px;
    overflow:hidden;
  }
  .gauge-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    width:0%;
    transition:width .35s ease;
  }
  .gauge-label{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    font-size:11px;
    color:var(--text);
    font-variant-numeric: tabular-nums;
  }
  .gauge-mid-line{
    position:absolute; top:0; bottom:0; left:50%;
    width:1px; background:rgba(255,255,255,0.08);
  }

  /* tabs */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:10px;
    -webkit-overflow-scrolling: touch;
  }
  .tab{
    flex:0 0 auto;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(45,212,191,0.08);
  }

  .row2{display:flex; gap:8px; margin-bottom:12px;}
  .timer-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    margin-bottom:12px;
    font-size:11px;
    color:var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .timer-row .timer-chip{
    padding:3px 8px;
    border-radius:6px;
    background:var(--panel);
    border:1px solid var(--line);
  }
  .timer-row .timer-chip.active{
    color:var(--accent);
    border-color:var(--accent);
    background:rgba(45,212,191,0.08);
  }
  select{
    flex:1;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 8px;
    font-size:12.5px;
  }
  button.mode-btn{
    flex:0 0 auto;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    font-size:12.5px;
  }
  button.mode-btn.active{
    border-color:var(--warn);
    color:var(--warn);
  }

  /* card */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 15px 15px;
    margin-bottom:12px;
  }
  .card-meta{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .card-meta .chip{
    background:var(--panel-2);
    border-radius:4px;
    padding:2px 7px;
  }
  .qtext{
    font-size:16px;
    font-weight:600;
    margin-bottom:14px;
    white-space:pre-wrap;
  }
  .blank{
    color:var(--accent);
    font-weight:700;
    border-bottom:1px dashed var(--accent);
  }

  .fill-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:15px;
    margin-bottom:10px;
  }
  .fill-input:focus{outline:none; border-color:var(--accent);}

  .opts{display:flex; flex-direction:column; gap:8px; margin-bottom:4px;}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1px solid var(--line);
    background:var(--panel-2);
    border-radius:8px;
    padding:10px 12px;
    font-size:14.5px;
    cursor:pointer;
  }
  .opt .letter{
    flex:0 0 auto;
    width:20px; height:20px;
    border-radius:5px;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px; font-weight:700; color:var(--muted);
  }
  .opt.selected{border-color:var(--warn); }
  .opt.selected .letter{border-color:var(--warn); color:var(--warn);}
  .opt.correct{border-color:var(--good); background:rgba(52,199,123,0.08);}
  .opt.correct .letter{border-color:var(--good); color:var(--good); background:rgba(52,199,123,0.15);}
  .opt.incorrect{border-color:var(--bad); background:rgba(239,91,91,0.08);}
  .opt.incorrect .letter{border-color:var(--bad); color:var(--bad); background:rgba(239,91,91,0.15);}

  .tf-row{display:flex; gap:10px; margin-bottom:4px;}
  .tf-btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    border-radius:8px;
    padding:12px;
    font-size:15px;
    font-weight:600;
  }
  .tf-btn.correct{border-color:var(--good); color:var(--good); background:rgba(52,199,123,0.1);}
  .tf-btn.incorrect{border-color:var(--bad); color:var(--bad); background:rgba(239,91,91,0.1);}

  .actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:8px;
    padding:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#0b1414;}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  .btn-warn{background:var(--bad); color:#fff;}
  .btn-good{background:var(--good); color:#08210f;}

  .feedback{
    margin-top:10px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13.5px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:rgba(52,199,123,0.1); color:var(--good); border:1px solid rgba(52,199,123,0.3);}
  .feedback.bad{background:rgba(239,91,91,0.1); color:var(--bad); border:1px solid rgba(239,91,91,0.3);}
  .feedback b{color:inherit;}

  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
    font-size:14px;
  }

  .nav{
    display:flex;
    gap:8px;
    margin-top:4px;
  }

  footer.hint{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:14px;
  }
</style>
</head>

<div style="text-align:right;font-size:13px;margin-bottom:6px"><a href="listen.html" style="color:#2dd4bf">🎧 简答题听力</a></div>

<div class="timer-row" id="timerRow"></div>

<div id="cardHost"></div>

, "section": "judge", "chapter": "现场管理方法", "num": 50, "question": "清扫就是突击打扫卫生，使工作场所符合卫生要求。", "answer": "错误"}, {"id": "judge-51", "section": "judge", "chapter": "现场管理方法", "num": 51, "question": "对物品进行规划布局，确定存储摆放的场所的活动属于整理的范畴。", "answer": "错误"}, {"id": "judge-52", "section": "judge", "chapter": "质量管理小组活动", "num": 52, "question": "QC 小组成员只能来自质量部门。", "answer": "错误"}, {"id": "judge-53", "section": "judge", "chapter": "质量管理小组活动", "num": 53, "question": "质量管理小组活动的每一个步骤都应当基于数据、信息等客观事实来开展调查、分析、 评价与决策。", "answer": "正确"}, {"id": "judge-54", "section": "judge", "chapter": "统计技术基础", "num": 54, "question": "连续型数据只能取整数，无小数。", "answer": "错误"}, {"id": "judge-55", "section": "judge", "chapter": "统计技术基础", "num": 55, "question": "样本标准差的数值越小，说明总体数据的波动越小，散布情况越集中。", "answer": "错误"}, {"id": "judge-56", "section": "judge", "chapter": "统计技术基础", "num": 56, "question": "简单随机抽样需要完整抽样框。", "answer": "正确"}, {"id": "judge-57", "section": "judge", "chapter": "统计技术基础", "num": 57, "question": "参数估计是针对关于总体的假设，利用样本数据对总体作出推断。", "answer": "错误"}, {"id": "judge-58", "section": "judge", "chapter": "统计技术基础", "num": 58, "question": "关系数 r=0.8 表示两个变量之间存在极强的正线性相关关系。", "answer": "错误"}, {"id": "judge-59", "section": "judge", "chapter": "过程分析与数据收集", "num": 59, "question": "问卷调查适合挖掘深度问题细节。", "answer": "错误"}, {"id": "judge-60", "section": "judge", "chapter": "过程分析与数据收集", "num": 60, "question": "流程展开图不仅能展示流程步骤，还能体现各步骤间的时间顺序关系。", "answer": "错误"}, {"id": "judge-61", "section": "judge", "chapter": "过程分析与数据收集", "num": 61, "question": "过程思维是指关注产品形成的过程，而不是仅在过程的终端实施控制。", "answer": "正确"}, {"id": "judge-62", "section": "judge", "chapter": "数据整理与分析", "num": 62, "question": "众数是排序后中间数值。", "answer": "错误"}, {"id": "judge-63", "section": "judge", "chapter": "数据整理与分析", "num": 63, "question": "直方图的分组数应根据收集的样本量来确定。", "answer": "正确"}, {"id": "judge-64", "section": "judge", "chapter": "数据整理与分析", "num": 64, "question": "条形图适合对比各类别数据大小。", "answer": "正确"}, {"id": "judge-65", "section": "judge", "chapter": "原因分析与解决方案", "num": 65, "question" , "answer": "B"}, {"id": "single-72", "section": "single", "chapter": "统计技术基础", "num": 72, "question": "下列属于计数型数据的是____", "options": {"A": "工件长度", "B": "生产车间温度", "C": "产品重量", "D": "每班不良品数量"}, "answer": "D"}, {"id": "single-73", "section": "single", "chapter": "统计技术基础", "num": 73, "question": "设 10 个数据的均值为 9.26, 如今又得第 11 个数据为 9.92, 则此 11 个数据的 均值为____", "options": {"A": "9.23", "B": "9.32", "C": "9.74", "D": "9.59"}, "answer": "B"}, {"id": "single-74", "section": "single", "chapter": "统计技术基础", "num": 74, "question": "单工序一次合格率 99%，连续 3 件产品全部合格概率为____", "options": {"A": "97.03%", "B": "98%", "C": "99%", "D": "95.2%"}, "answer": "A"}, {"id": "single-75", "section": "single", "chapter": "统计技术基础", "num": 75, "question": "用于展示两个变量之间线性相关关系的图表是____", "options": {"A": "直方图", "B": "散布图", "C": "条形图", "D": "控制图"}, "answer": "B"}, {"id": "single-76", "section": "single", "chapter": "过程分析与数据收集", "num": 76, "question": "适合生产现场实时记录不良缺陷的数据收集工具是____", "options": {"A": "检查表", "B": "文献研究法", "C": "客户访谈", "D": "实验室试验"}, "answer": "A"}, {"id": "single-77", "section": "single", "chapter": "过程分析与数据收集", "num": 77, "question": "为了研究生产过程中温度对产品质量的影响，最合适的数据收集方法是____", "options": {"A": "焦点问题小组法", "B": "实验法", "C": "访谈法", "D": "文献研究法"}, "answer": "B"}, {"id": "single-78", "section": "single", "chapter": "过程分析与数据收集", "num": 78, "question": "消除流程瓶颈的核心方法是____", "options": {"A": "在瓶颈前堆积库存", "B": "加快瓶颈前工序速度", "C": "提升瓶颈工序处理能力", "D": "减少产线投入产品数量"}, "answer": "C"}, {"id": "single-79", "section": "single", "chapter": "数据整理与分析", "num": 79, "question": "下列统计量中，用于描述数据离散波动程度的是____", "options": {"A": "中位数", "B": "平均值", "C": "标准差", "D": "众数"}, "answer": "C"}, {"id": "short-1", "section": "short", "num": 1, "chapter": "综合简答", "question": "企业管理及生产活动中存在哪七种典型的浪费？", "answer": "企业管理及生产活动中存在的七种典型浪费是过量生产、等待、运输、额外作业、库存、多余动作和返工返修。"}, {"id": "short-2", "section": "short", "num": 2, "chapter": "综合简答", "question": "什么是节拍时间（Takt Time），如何计算？", "answer": "节拍时间是满足客户需求的单件产品目标生产时长。 计算公式：节拍时间 = 每日有效工作时间 ÷ 每日客户需求数量。"}, {"id": "short-3", "section": "short", "num": 3, "chapter": "综合简答", "question": "推行目视化管理的步骤是什么？", "answer": "第一步：安全等各类指示清晰；给关键区域画出指示方向，并悬挂标志；展示各类设备的识别标识；标识物料名称、质量、数量（包括最大最小量）；在工具和零部件上贴上标牌；关键指标有仪表标识并显示正常范围；运用图表公布 5S 审查结果。\n第二步：使用图示阐明标准化作业流程（包括安全、质量关键点），并公开展示；明确标准作业流程，将标准流程和实际作业时间可视化；将设备点巡检流程公开展示；在设备上标识检测点，并使用一级维护目视卡等方法。\n第三步：安装状态灯，显示设备运行状态；使用颜色编码板和显示板显示出生产计划，产量达成，异常状态；展示对存在问题的实时跟踪反馈。\n第四步：安装并使用业绩跟踪板，展示关键业绩指标；展示指标发展趋势。\n第五步：组织架构、人员、能力等可视化；展示问题统计分析结果；使用图表及时发布自主改善计划、状况和现场改善审查结果；传达改善活动的成功事例。\n第六步：对人才梯队建设的可视化，图示可视化的培训环境，标识能力培养标准及培训效率和质量。"}, {"id": "short-4", "section": "short", "num": 4, "chapter": "综合简答", "question": "简述标准 QC 小组完整活动循环步骤。", "answer": "（1）选定课题问题\n（2）开展现状调查\n（3）分析确定主要原因\n（4）制定并实施改善对策\n（5）检查改善实施效果\n（6）将有效改善成果标准化\n（7）规划下一改善课题"}, {"id": "short-5", "section": "short", "num": 5, "chapter": "综合简答", "question": "质量管理工具中有一类主要用于管理和策划的，试举出一些这类质量工具的实例。", "answer": "用于管理和策划的工具有头脑风暴、亲和图、矩阵图、树图等。"}, {"id": "short-6", "section": "short", "num": 6, "chapter": "综合简答", "question": "什么是设备综合效率 OEE，由哪三大指标构成？", "answer": "OEE 即设备综合效率。三大构成指标：设备时间稼动率、设备性能开动率、产品良品率。"}, {"id": "short-7", "section": "short", "num": 7, "chapter": "综合简答", "question": "什么是计量数据和计数数据？怎样区分它们？", "answer": "计量数据：可以连续取值的，或者说可以用测量工具具体测量出小数点以下数值的数据。计数数据：不能连续取值的，或者说即使利用测量工具也得不到小数点以下数值的数据。"}, {"id": "short-8", "section": "short", "num": 8, "chapter": "综合简答", "question": "根据数据类型，简述三类控制图及代表图表。", "answer": "计量值控制图：均值极差图、均值标准差图\n计点值（缺陷数）控制图：c 图、u 图\n计件值（不良品数）控制图：p 图、np 图"}, {"id": "short-9", "section": "short", "num": 9, "chapter": "综合简答", "question": "请描述流程图的定义，以及流程图的作用。", "answer": "流程图是用图形的方式表现出所要研究的过程。流程图的作用：通过代表各种活动的图形来了解过程，绘制和分析流程图可以对过程进行认识和沟通，发现过程中可能的问题源以及发现改进的机会。"}, {"id": "short-10", "section": "short", "num": 10, "chapter": "综合简答", "question": "简述过程能力指数 Cp 与 Cpk 的关系。", "answer": "Cp 仅对比规格宽度与过程波动，不考虑均值偏移；Cpk 同时兼顾过程波动和均值相对规格中心的偏移；Cpk 数值永远小于等于 Cp。"}, {"id": "short-11", "section": "short", "num": 11, "chapter": "综合简答", "question": "质量管理的八项原则是什么？", "answer": "以顾客为关注焦点、领导作用、全员参与、过程方法、管理的系统方法、持续改进、基于事实的决策方法、与供方互利的关系。"}, {"id": "short-12", "section": "short", "num": 12, "chapter": "综合简答", "question": "简述 5S 五项内容及各自核心目的。", "answer": "整理：区分现场必需品与非必需品，减少现场杂物\n整顿：必需品定点定置摆放，取用高效\n清扫：清扫现场脏污，提前发现设备故障\n清洁：标准化维持前 3S 成果\n素养：培养员工自觉长期执行前 4S 的习惯"}, {"id": "short-13", "section": "short", "num": 13, "chapter": "综合简答", "question": "质量改进的基本过程是什么？", "answer": "质量改进的基本过程是 PDCA 循环。通过不断地计划、执行、检查和处理，实现质量的持续改进。"}, {"id": "short-14", "section": "short", "num": 14, "chapter": "综合简答", "question": "质量控制与质量改进的区别是什么？", "answer": "质量控制：维持现有质量稳定，防止质量水平下滑； 质量改进：将现有质量水平提升至更高标准。"}, {"id": "short-15", "section": "short", "num": 15, "chapter": "综合简答", "question": "质量管理体系文件通常包括哪些？", "answer": "通常包括质量手册、程序文件、作业指导书和质量记录。质量手册阐述质量管理体系范围和方针；程序文件规定活动流程和方法；作业指导书提供具体操作指导；质量记录用于记录质量活动结果。"}, {"id": "short-16", "section": "short", "num": 16, "chapter": "综合简答", "question": "什么是价值流图 VSM，分为哪两类？", "answer": "价值流图是梳理从订单下发到成品交付全价值流程的图表工具；分为现状价值流图、未来改善价值流图。"}, {"id": "short-17", "section": "short", "num": 17, "chapter": "综合简答", "question": "简述现场质量管理采用的措施原则。", "answer": "原则上有质量预防、质量维持、质量改进、质量验证四个方面。质量预防是提前采取措施防止质量问题发生；质量维持确保现有质量水平稳定；质量改进致力于提升质量；质量验证对质量是否符合要求进行确认。"}, {"id": "short-18", "section": "short", "num": 18, "chapter": "综合简答", "question": "推行六西格玛管理的核心目标是什么？", "answer": "最大限度降低流程波动，趋近零缺陷；以数据和事实为依据开展决策；同步提升客户满意度与企业经营收益。"}, {"id": "short-19", "section": "short", "num": 19, "chapter": "综合简答", "question": "质量检验的主要功能有哪些？", "answer": "主要功能包括鉴别功能（判断产品是否符合质量标准）、把关功能（防止不合格品流入下一道工序或交付给顾客）、预防功能（通过检验发现质量问题趋势，采取预防措施）和报告功能（将检验结果和质量信息反馈给相关部门）。"}, {"id": "short-20", "section": "short", "num": 20, "chapter": "综合简答", "question": "精益管理与六西格玛管理的区别是什么", "answer": "精益核心是消除各类浪费、加快流程流转速度；六西格玛核心是减少数据波动、降低缺陷；二者常结合形成精益六西格玛综合改善体系。"}]
</script>
<script>
const ALL_QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);

const TYPE_LABELS = {all:'全部', fill:'填空', judge:'判断', single:'单选', multi:'多选', short:'简答'};

let state = {
  type: 'all',
  chapter: 'all',
  ordered: false,
  wrongOnly: false,
  pool: [],
  idx: 0,
  answered: false,
  selected: [],       // for single/multi
  sessionRight: 0,
  sessionSeen: 0,
};

let wrongIds = new Set();
let seenRightIds = new Set(); // ids answered correctly at least once this load (for stat display only)

// ---- per-type timer (resets to 0 each time you enter that type) ----
const TIMER_TYPES = ['fill','judge','single','multi','short'];
let timeAccum = {fill:0, judge:0, single:0, multi:0, short:0};
let timerActiveType = null;
let timerStartMs = null;

// ---- speed history: records each completed round's time per type, persisted ----
let timeHistory = {fill:[], judge:[], single:[], multi:[], short:[]};
function loadHistory(){
  try{
    const raw = localStorage.getItem('tqm-time-history');
    if(raw){
      const parsed = JSON.parse(raw);
      TIMER_TYPES.forEach(t=>{ if(Array.isArray(parsed[t])) timeHistory[t] = parsed[t]; });
    }
  }catch(e){}
}
function saveHistory(){
  try{ localStorage.setItem('tqm-time-history', JSON.stringify(timeHistory)); }catch(e){}
}
function recordRound(type, seconds){
  if(seconds < 3) return; // ignore accidental instant taps
  timeHistory[type].push({ t: Math.round(seconds), when: Date.now() });
  if(timeHistory[type].length > 50) timeHistory[type] = timeHistory[type].slice(-50);
  saveHistory();
}

function stopTimer(recordIt){
  if(timerActiveType && timerStartMs){
    const elapsed = (Date.now()-timerStartMs)/1000;
    timeAccum[timerActiveType] += elapsed;
    if(recordIt) recordRound(timerActiveType, timeAccum[timerActiveType]);
  }
  timerActiveType = null;
  timerStartMs = null;
}
function startTimerFor(type){
  stopTimer(true); // leaving the previous type counts as finishing that round
  if(TIMER_TYPES.includes(type)){
    timeAccum[type] = 0; // reset to zero every time this type is entered
    timerActiveType = type;
    timerStartMs = Date.now();
  }
}
function formatTime(sec){
  sec = Math.floor(sec);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function renderTimerRow(){
  const host = document.getElementById('timerRow');
  const liveExtra = timerActiveType ? (Date.now()-timerStartMs)/1000 : 0;
  host.innerHTML = TIMER_TYPES.map(t=>{
    const total = timeAccum[t] + (t===timerActiveType ? liveExtra : 0);
    const active = t===timerActiveType;
    return `<span class="timer-chip${active?' active':''}">${TYPE_LABELS[t]} ${formatTime(total)}</span>`;
  }).join('') + `<span class="timer-chip" id="historyToggle" style="cursor:pointer;">📊 用时记录</span>`;
  document.getElementById('historyToggle').onclick = toggleHistoryPanel;
}
function toggleHistoryPanel(){
  const existing = document.getElementById('historyPanel');
  if(existing){ existing.remove(); return; }
  const panel = document.createElement('div');
  panel.id = 'historyPanel';
  panel.className = 'card';
  panel.style.marginBottom = '12px';
  panel.innerHTML = TIMER_TYPES.map(t=>{
    const hist = timeHistory[t];
    if(hist.length===0) return `<div style="margin-bottom:8px;"><b>${TYPE_LABELS[t]}</b>：暂无记录</div>`;
    const times = hist.slice(-8).reverse().map(h=>formatTime(h.t));
    const avg = hist.reduce((a,h)=>a+h.t,0)/hist.length;
    return `<div style="margin-bottom:8px;"><b>${TYPE_LABELS[t]}</b>（共${hist.length}轮，平均${formatTime(avg)}）：最近 ${times.join('、')}</div>`;
  }).join('');
  document.getElementById('timerRow').insertAdjacentElement('afterend', panel);
}
setInterval(renderTimerRow, 1000);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ stopTimer(false); }
  else if(state.type !== 'all' && TIMER_TYPES.includes(state.type)){
    // resume without resetting or recording (visibility pause, not a fresh entry)
    timerActiveType = state.type;
    timerStartMs = Date.now();
  }
});
window.addEventListener('beforeunload', ()=>stopTimer(true));


function loadWrong(){
  try{
    const raw = localStorage.getItem('tqm-wrong-ids');
    if(raw){ wrongIds = new Set(JSON.parse(raw)); }
  }catch(e){ wrongIds = new Set(); }
  updateWrongCount();
}
function saveWrong(){
  try{ localStorage.setItem('tqm-wrong-ids', JSON.stringify([...wrongIds])); }catch(e){}
}
function updateWrongCount(){
  document.getElementById('wrongCount').textContent = wrongIds.size;
}

function chaptersFor(type){
  const set = [];
  const seen = new Set();
  ALL_QUESTIONS.forEach(q=>{
    if(type!=='all' && q.section!==type) return;
    if(!seen.has(q.chapter)){ seen.add(q.chapter); set.push(q.chapter); }
  });
  return set;
}

function buildTabs(){
  const host = document.getElementById('typeTabs');
  host.innerHTML = '';
  Object.keys(TYPE_LABELS).forEach(key=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (state.type===key ? ' active' : '');
    const count = key==='all' ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(q=>q.section===key).length;
    btn.textContent = TYPE_LABELS[key] + ' ' + count;
    btn.onclick = ()=>{
      state.type = key;
      state.chapter='all';
      if(key==='all'){ stopTimer(true); } else { startTimerFor(key); }
      buildTabs(); buildChapterSelect(); resetPool(); renderTimerRow();
    };
    host.appendChild(btn);
  });
}

function buildChapterSelect(){
  const sel = document.getElementById('chapterSelect');
  const chapters = chaptersFor(state.type);
  sel.innerHTML = '<option value="all">全部章节</option>' + chapters.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value = state.chapter;
  sel.onchange = ()=>{ state.chapter = sel.value; resetPool(); };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getShuffledOptions(q){
  const entries = Object.entries(q.options);
  const correctSet = new Set(q.answer.split(''));
  const marked = entries.map(([letter,text])=>({text, correct: correctSet.has(letter)}));
  const shuffled = shuffle(marked);
  const letters = 'ABCDEFGH'.slice(0, shuffled.length).split('');
  const options = {};
  let answer = '';
  shuffled.forEach((item,i)=>{
    options[letters[i]] = item.text;
    if(item.correct) answer += letters[i];
  });
  return {options, answer};
}

// character-level LCS diff: returns array of {ch, match} for the reference string,
// where match=true if ch participates in the longest common subsequence with userStr
function diffAgainstReference(userStr, refStr){
  const u = [...userStr];
  const r = [...refStr];
  const n = u.length, m = r.length;
  const dp = Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      if(u[i-1]===r[j-1]) dp[i][j] = dp[i-1][j-1]+1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  // backtrack to find which ref indices are matched
  const matchedRef = new Array(m).fill(false);
  let i=n, j=m;
  while(i>0 && j>0){
    if(u[i-1]===r[j-1]){
      matchedRef[j-1]=true;
      i--; j--;
    } else if(dp[i-1][j] >= dp[i][j-1]){
      i--;
    } else {
      j--;
    }
  }
  return r.map((ch,idx)=>({ch, match: matchedRef[idx]}));
}

function resetPool(){
  let pool = ALL_QUESTIONS.filter(q=>{
    if(state.type!=='all' && q.section!==state.type) return false;
    if(state.chapter!=='all' && q.chapter!==state.chapter) return false;
    if(state.wrongOnly && !wrongIds.has(q.id)) return false;
    return true;
  });
  if(!state.ordered) pool = shuffle(pool);
  state.pool = pool;
  state.idx = 0;
  state.sessionRight = 0;
  state.sessionSeen = 0;
  renderCard();
}

function updateGauge(){
  const total = state.pool.length;
  const posDisplay = total ? Math.min(state.idx+1, total) : 0;
  document.getElementById('gaugeText').textContent = `${posDisplay} / ${total}`;
  const pct = total ? (posDisplay/total*100) : 0;
  document.getElementById('gaugeFill').style.width = pct+'%';
  let setName = TYPE_LABELS[state.type];
  if(state.chapter!=='all') setName += ' · ' + state.chapter;
  if(state.wrongOnly) setName += '（错题）';
  document.getElementById('gaugeSetName').textContent = setName;

  const acc = state.sessionSeen ? Math.round(state.sessionRight/state.sessionSeen*100) : null;
  document.getElementById('accStat').textContent = acc===null ? '--' : acc+'%';
}

function markResult(q, correct){
  state.sessionSeen++;
  if(correct){ state.sessionRight++; }
  if(!correct){ wrongIds.add(q.id); }
  else if(state.wrongOnly && wrongIds.has(q.id)){ wrongIds.delete(q.id); }
  saveWrong();
  updateWrongCount();
  updateGauge();
}

function renderCard(){
  updateGauge();
  const host = document.getElementById('cardHost');
  const foot = document.getElementById('footHint');
  if(state.pool.length===0){
    host.innerHTML = `<div class="card"><div class="empty">${state.wrongOnly ? '这个范围内还没有错题，先去练习吧 👍' : '没有匹配的题目'}</div></div>`;
    foot.textContent='';
    return;
  }
  const q = state.pool[state.idx];
  state.answered = false;
  state.selected = [];

  const card = document.createElement('div');
  card.className = 'card';

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.innerHTML = `<span class="chip">${TYPE_LABELS[q.section]} · ${q.chapter}</span><span>#${q.num}</span>`;
  card.appendChild(meta);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.innerHTML = escapeHtml(q.question).replace(/____/g, '<span class="blank">____</span>');
  card.appendChild(qtext);

  const body = document.createElement('div');
  card.appendChild(body);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback';

  const actions = document.createElement('div');
  actions.className = 'actions';

  if(q.section==='fill'){
    body.innerHTML = `<input class="fill-input" id="fillInput" placeholder="输入你记得的答案，或直接点"下一题"看答案" autocomplete="off" />`;
    const checkBtn = mkBtn('对答案', 'btn-primary', ()=>{
      const val = document.getElementById('fillInput').value.trim();
      showFillAnswer(q, val, feedback);
    });
    actions.appendChild(checkBtn);
  } else if(q.section==='judge'){
    const row = document.createElement('div');
    row.className = 'tf-row';
    const rightBtn = mkTfBtn('正确', ()=>selectJudge(q,'正确',rightBtn,wrongBtnEl,feedback));
    const wrongBtnEl = mkTfBtn('错误', ()=>selectJudge(q,'错误',rightBtn,wrongBtnEl,feedback));
    row.appendChild(rightBtn); row.appendChild(wrongBtnEl);
    body.appendChild(row);
  } else if(q.section==='single' || q.section==='multi'){
    const shuffled = getShuffledOptions(q);
    const optsWrap = document.createElement('div');
    optsWrap.className = 'opts';
    const letters = Object.keys(shuffled.options);
    const optEls = {};
    letters.forEach(letter=>{
      const el = document.createElement('div');
      el.className = 'opt';
      el.innerHTML = `<span class="letter">${letter}</span><span>${escapeHtml(shuffled.options[letter])}</span>`;
      el.onclick = ()=>{
        if(state.answered) return;
        if(q.section==='single'){
          state.selected = [letter];
          Object.values(optEls).forEach(e=>e.classList.remove('selected'));
          el.classList.add('selected');
        } else {
          if(state.selected.includes(letter)){
            state.selected = state.selected.filter(l=>l!==letter);
            el.classList.remove('selected');
          } else {
            state.selected.push(letter);
            el.classList.add('selected');
          }
        }
      };
      optEls[letter]=el;
      optsWrap.appendChild(el);
    });
    body.appendChild(optsWrap);
    const submitBtn = mkBtn('提交答案', 'btn-primary', ()=>{
      if(state.selected.length===0) return;
      submitChoice(q, optEls, feedback, shuffled.answer);
    });
    actions.appendChild(submitBtn);
  } else if(q.section==='short'){
    body.innerHTML = `<textarea class="fill-input" id="shortInput" rows="4" placeholder="输入你的答案，逐字比对，回车不提交" style="resize:vertical; font-family:inherit;"></textarea>`;
    const checkBtn = mkBtn('判分', 'btn-primary', ()=>{
      const val = document.getElementById('shortInput').value.trim();
      showShortAnswer(q, val, feedback);
    });
    actions.appendChild(checkBtn);
  }

  card.appendChild(actions);
  card.appendChild(feedback);

  const navRow = document.createElement('div');
  navRow.className = 'nav';
  const nextBtn = mkBtn('下一题 →', 'btn-ghost', ()=>{
    const wasLast = (state.idx === state.pool.length-1);
    state.idx = (state.idx+1) % state.pool.length;
    if(wasLast && !state.ordered){
      state.pool = shuffle(state.pool);
      state.idx = 0;
      state.sessionRight = 0;
      state.sessionSeen = 0;
      state.justReshuffled = true;
    }
    renderCard();
  });
  navRow.appendChild(nextBtn);
  card.appendChild(navRow);

  host.innerHTML = '';
  host.appendChild(card);

  foot.textContent = `共 ${state.pool.length} 题 · 本轮正确 ${state.sessionRight}/${state.sessionSeen}${state.justReshuffled ? '（新一轮已打乱顺序）' : ''}`;
  state.justReshuffled = false;
}

function mkBtn(text, cls, onclick){
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.textContent = text;
  b.onclick = onclick;
  return b;
}
function mkTfBtn(text, onclick){
  const b = document.createElement('button');
  b.className = 'tf-btn';
  b.textContent = text;
  b.onclick = onclick;
  return b;
}

function showFillAnswer(q, userVal, feedback){
  if(state.answered) return;
  state.answered = true;
  const answers = q.answer.join('、');
  const guessedRight = userVal && q.answer.some(a=> a.replace(/\s/g,'') === userVal.replace(/\s/g,''));
  feedback.className = 'feedback show ' + (guessedRight ? 'good' : 'bad');
  feedback.innerHTML = guessedRight
    ? `✅ 正确！答案：<b>${escapeHtml(answers)}</b>`
    : `参考答案：<b>${escapeHtml(answers)}</b>${userVal ? '（你的答案未完全匹配，自行判断是否算对）' : ''}`;
  const marked = confirmSelfGraded(feedback, q, guessedRight);
}

function confirmSelfGraded(feedback, q, defaultGuess){
  // add self-grade buttons since fill-in matching is fuzzy
  const wrap = document.createElement('div');
  wrap.style.display='flex';
  wrap.style.gap='8px';
  wrap.style.marginTop='8px';
  const goodBtn = mkBtn('我记对了', 'btn-good', ()=>{ markResult(q, true); wrap.remove(); goodBtn.disabled=true; badBtn.disabled=true;});
  const badBtn = mkBtn('没记住', 'btn-warn', ()=>{ markResult(q, false); wrap.remove(); goodBtn.disabled=true; badBtn.disabled=true;});
  wrap.appendChild(goodBtn); wrap.appendChild(badBtn);
  feedback.appendChild(wrap);
}

function selectJudge(q, choice, rightBtn, wrongBtnEl, feedback){
  if(state.answered) return;
  state.answered = true;
  const correct = choice === q.answer;
  if(q.answer==='正确') rightBtn.classList.add('correct');
  else if(choice==='正确') rightBtn.classList.add('incorrect');
  if(q.answer==='错误') wrongBtnEl.classList.add('correct');
  else if(choice==='错误') wrongBtnEl.classList.add('incorrect');
  feedback.className = 'feedback show ' + (correct ? 'good':'bad');
  feedback.innerHTML = correct ? '✅ 回答正确！' : `❌ 答错了，正确答案是：<b>${q.answer}</b>`;
  markResult(q, correct);
}

function submitChoice(q, optEls, feedback, correctAnswer){
  if(state.answered) return;
  state.answered = true;
  const correctLetters = correctAnswer.split('');
  const selected = state.selected.slice().sort();
  const correct = selected.join('') === correctLetters.slice().sort().join('');
  Object.keys(optEls).forEach(letter=>{
    if(correctLetters.includes(letter)) optEls[letter].classList.add('correct');
    else if(selected.includes(letter)) optEls[letter].classList.add('incorrect');
  });
  feedback.className = 'feedback show ' + (correct ? 'good':'bad');
  feedback.innerHTML = correct ? '✅ 回答正确！' : `❌ 答错了，正确答案是：<b>${correctAnswer}</b>`;
  markResult(q, correct);
}

function showShortAnswer(q, userVal, feedback){
  if(state.answered) return;
  const exact = userVal === q.answer;
  if(exact){
    state.answered = true;
    feedback.className = 'feedback show good';
    feedback.innerHTML = '✅ 一字不差，完全正确！';
    markResult(q, true);
    return;
  }
  state.answered = true;
  const diff = diffAgainstReference(userVal, q.answer);
  const diffHtml = diff.map(d => d.match
    ? `<span style="color:var(--good); font-weight:600;">${escapeHtml(d.ch)}</span>`
    : `<span style="color:var(--bad); font-weight:700; text-decoration:underline; text-decoration-color:var(--bad);">${escapeHtml(d.ch)}</span>`
  ).join('');
  feedback.className = 'feedback show bad';
  feedback.innerHTML = `未完全匹配，参考答案（红色为你没答对的部分）：<br><div style="margin-top:6px; line-height:1.7;">${diffHtml}</div>`;
  confirmSelfGraded(feedback, q, false);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('orderBtn').onclick = ()=>{
  state.ordered = !state.ordered;
  document.getElementById('orderBtn').classList.toggle('active', state.ordered);
  document.getElementById('orderBtn').textContent = state.ordered ? '顺序 ✓' : '顺序';
  resetPool();
};
document.getElementById('wrongBtn').onclick = ()=>{
  state.wrongOnly = !state.wrongOnly;
  document.getElementById('wrongBtn').classList.toggle('active', state.wrongOnly);
  resetPool();
};

(function init(){
  loadWrong();
  loadHistory();
  buildTabs();
  buildChapterSelect();
  resetPool();
  renderTimerRow();
})();
</script>
